{% extends "base.html" %}
{% block title %}Reset Password — Auralis Health{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card shadow border-0" style="max-width: 400px;">
    <div class="card-body p-4 text-center">
      <h5 class="fw-bold mb-3 text-success">Reset Password</h5>
      <p class="text-muted small mb-4">Enter your email to receive a reset link.</p>
      <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="btn btn-success w-100 mt-3">Send Reset Link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
