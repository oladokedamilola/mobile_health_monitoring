{% extends "base.html" %}
{% load static %}

{% block title %}Doctor Verification — Auralis Health{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body">
      <h4 class="fw-bold text-success mb-3 text-center">Doctor Verification (KYC)</h4>
      <p class="text-muted small text-center">Provide your professional details for verification.</p>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-3">Submit Verification</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
