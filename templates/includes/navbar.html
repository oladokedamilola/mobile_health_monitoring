{% load static %}
<nav class="navbar navbar-expand-lg shadow-sm" style="background: linear-gradient(90deg, #2D6A4F, #40916C);">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="{% url 'home' %}">
      <img src="{% static 'img/logo-icon.svg' %}" alt="Auralis Logo" width="30" height="30" class="me-2">
      Auralis Health
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        
        <!-- Common Links -->
        <li class="nav-item">
          <a class="nav-link text-white fw-medium px-3" href="{% url 'home' %}">Home</a>
        </li>
        {% if user.is_authenticated %}
          <!-- Authenticated User Links -->
          <li class="nav-item">
            <a class="nav-link text-white fw-medium px-3" href="#">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white fw-medium px-3" href="{% url 'analytics:analytics' %}">Analytics</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white fw-medium px-3" href="{% url 'notifications:notifications' %}">Notifications</a>
          </li>

          <!-- User Dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-white fw-semibold px-3" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i> {{ user.username|title }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
              <li><a class="dropdown-item" href="{% url 'profile' %}">Profile</a></li>
              <li><a class="dropdown-item" href="#">Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Logout</a></li>
            </ul>
          </li>
        
        {% else %}
         <!-- Guest Links -->
        <li class="nav-item">
          <a class="nav-link text-white fw-medium px-3" 
            href="#" 
            data-bs-toggle="modal" 
            data-bs-target="#roleSelectModal">
            Register
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fw-medium px-3" href="{% url 'accounts:login' %}">Login</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
