{% extends 'base_monitor.html' %}
{% block title %}SpO₂ Monitor{% endblock %}

{% block content %}
<div class="container py-4 text-center">
  <h3 class="fw-bold mb-3 text-success">🫁 SpO₂ Monitor</h3>
  <p class="text-muted">Please remain still while your oxygen level is being estimated.</p>

  <div class="display-3 fw-bold text-success" id="spo2">--%</div>
  <p class="text-muted">Oxygen Saturation</p>

  <button id="startBtn" class="btn btn-success mt-3 px-4">Start Measurement</button>

  <div id="status" class="mt-3 text-muted"></div>
</div>

<script>
document.getElementById("startBtn").addEventListener("click", () => {
  const spo2Display = document.getElementById("spo2");
  const status = document.getElementById("status");

  status.textContent = "Measuring...";
  const interval = setInterval(() => {
    fetch("{% url 'monitoring:spo2_data_api' %}")  // you'll define this API soon
      .then(res => res.json())
      .then(data => {
        spo2Display.textContent = data.spo2 + "%";
        status.textContent = data.status;
      });
  }, 3000);
});
</script>
{% endblock %}
