{% extends 'base_monitor.html' %}
{% block title %}Sleep Tracker{% endblock %}

{% block content %}
<div class="container py-4 text-center">
  <h3 class="fw-bold mb-3 text-info">🌙 Sleep Tracker</h3>
  <p class="text-muted">Monitor sleep quality, duration, and consistency.</p>

  <div class="row justify-content-center">
    <div class="col-md-4 mb-3">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6 class="text-muted">Sleep Duration</h6>
          <h3 id="duration" class="fw-bold text-info">-- hrs</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6 class="text-muted">Sleep Quality</h6>
          <h4 id="quality" class="fw-bold text-dark">--</h4>
        </div>
      </div>
    </div>
  </div>

  <button id="startBtn" class="btn btn-info px-4 mt-3">Analyze Sleep</button>
</div>

<script>
document.getElementById("startBtn").addEventListener("click", () => {
  const durationEl = document.getElementById("duration");
  const qualityEl = document.getElementById("quality");

  setInterval(() => {
    fetch("{% url 'monitoring:sleep_data_api' %}") // API endpoint you'll define
      .then(res => res.json())
      .then(data => {
        durationEl.textContent = data.duration + " hrs";
        qualityEl.textContent = data.quality;
      });
  }, 4000);
});
</script>
{% endblock %}
