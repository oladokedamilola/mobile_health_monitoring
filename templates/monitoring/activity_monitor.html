{% extends 'base.html' %}
{% block title %}Activity Monitor{% endblock %}

{% block content %}
<div class="container py-4 text-center">
  <h3 class="fw-bold mb-3 text-dark">🚶 Activity Monitor</h3>
  <p class="text-muted">Detecting your current physical activity...</p>

  <div class="fw-bold fs-1" id="activity">--</div>
  <div class="text-muted">Intensity: <span id="intensity">--</span></div>

  <button id="startBtn" class="btn btn-dark mt-3 px-4">Start Tracking</button>
</div>

<script>
document.getElementById("startBtn").addEventListener("click", () => {
  const activityEl = document.getElementById("activity");
  const intensityEl = document.getElementById("intensity");
  setInterval(() => {
    fetch("{% url 'monitoring:activity_data_api' %}")
      .then(res => res.json())
      .then(data => {
        activityEl.textContent = data.activity_type;
        intensityEl.textContent = data.intensity;
      });
  }, 2500);
});
</script>
{% endblock %}
