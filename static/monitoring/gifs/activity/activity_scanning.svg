<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="activityScanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#495057"/>
      <stop offset="100%" stop-color="#6c757d"/>
    </linearGradient>
    <style>
      @keyframes move {
        0% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        100% { transform: translateX(-5px); }
      }
      .move { animation: move 2s ease-in-out infinite; }
    </style>
  </defs>
  <g class="move">
    <circle cx="100" cy="70" r="15" fill="url(#activityScanGrad)"/>
    <path d="M85,85 Q100,70 115,85 L115,150 Q100,165 85,150 Z" fill="url(#activityScanGrad)" opacity="0.8"/>
    <circle cx="90" cy="140" r="8" fill="#343a40"/>
    <circle cx="110" cy="140" r="8" fill="#343a40"/>
  </g>
</svg>