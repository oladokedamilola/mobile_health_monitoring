<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="breathScanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0dcaf0"/>
    </linearGradient>
    <style>
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      .breathe { animation: breathe 3s ease-in-out infinite; }
    </style>
  </defs>
  <g class="breathe">
    <circle cx="100" cy="100" r="40" fill="none" stroke="url(#breathScanGrad)" stroke-width="8"/>
    <circle cx="100" cy="100" r="25" fill="none" stroke="url(#breathScanGrad)" stroke-width="6"/>
  </g>
</svg>